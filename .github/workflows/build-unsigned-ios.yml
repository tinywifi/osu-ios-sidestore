name: Build unsigned iOS IPA (Debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: Publish unsigned IPA
        run: >
          dotnet publish osu.iOS/osu.iOS.csproj
          -c Debug
          -f net10.0-ios
          -r ios-arm64
          -p:BuildIpa=true
          -p:EnableCodeSigning=false
          -p:CodesignKey=
          -p:CodesignProvision=

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: osu-ios-unsigned
          path: '**/*.ipa'
          if-no-files-found: error
